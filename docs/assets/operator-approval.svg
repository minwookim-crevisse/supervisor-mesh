<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="ttl">
<title id="ttl">How your approval is recorded: your prompt in the PM pane triggers the UserPromptSubmit hook, which records a candidate event; when the PM calls pane_command citing it, mesh checks the transcript, then types into the lead pane and tells the lead</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:15px;font-weight:600}
.l{font-size:13px;fill:#1f2328;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.n{font-size:13px;font-weight:700;fill:#ffffff}
.o{stroke:#424a53;stroke-width:1.6;fill:none}
.v{stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 5}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#424a53"/></marker>
<symbol id="ip" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g></symbol>
<symbol id="it" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="3"/><path d="M7 10l3 2.5L7 15M12.5 15H17"/></g></symbol>
<symbol id="ih" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="4.5" r="1.8"/><path d="M15 6.3V15a5 5 0 0 1-10 0v-2.5"/><path d="M3 14.5l2-2.5 2 2.5"/></g></symbol>
<symbol id="ig" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></g></symbol>
<symbol id="is" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5.5c0 4.6-3.3 8.4-8 9.5-4.7-1.1-8-4.9-8-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g></symbol>
</defs>
<rect x="1" y="1" width="1058" height="678" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

<!-- lifelines -->
<path class="v" d="M100 96V656M330 96V656M545 96V656M760 96V656M960 96V656"/>

<!-- participants -->
<rect x="20" y="24" width="160" height="72" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<use href="#ip" x="87" y="32" width="26" height="26" color="#424a53"/>
<text class="t" x="100" y="82" text-anchor="middle">You</text>
<rect x="250" y="24" width="160" height="72" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<use href="#it" x="317" y="32" width="26" height="26" color="#0969da"/>
<text class="t" x="330" y="82" text-anchor="middle">PM pane</text>
<rect x="465" y="24" width="160" height="72" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<use href="#ih" x="532" y="32" width="26" height="26" color="#424a53"/>
<text class="t" x="545" y="82" text-anchor="middle">prompt hook</text>
<rect x="680" y="24" width="160" height="72" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<use href="#ig" x="747" y="32" width="26" height="26" color="#1a7f37"/>
<text class="t" x="760" y="82" text-anchor="middle">mesh server</text>
<rect x="880" y="24" width="160" height="72" rx="12" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
<use href="#it" x="947" y="32" width="26" height="26" color="#8250df"/>
<text class="t" x="960" y="82" text-anchor="middle">lead pane</text>

<!-- 1 You -> PM -->
<circle cx="120" cy="136" r="11" fill="#0969da"/><text class="n" x="120" y="141" text-anchor="middle">1</text>
<text class="l" x="138" y="141">type "use the pane command</text>
<text class="l" x="138" y="159">tool to type /compact into</text>
<text class="l" x="138" y="177">the qa lead pane"</text>
<path class="o" d="M100 196H327" marker-end="url(#a)"/>

<!-- 2 PM -> hook -->
<circle cx="350" cy="235" r="11" fill="#0969da"/><text class="n" x="350" y="240" text-anchor="middle">2</text>
<text class="l m" x="368" y="240">UserPromptSubmit</text>
<path class="o" d="M330 254H542" marker-end="url(#a)"/>

<!-- 3 hook -> mesh -->
<circle cx="565" cy="280" r="11" fill="#0969da"/><text class="n" x="565" y="285" text-anchor="middle">3</text>
<text class="l" x="583" y="285">record a candidate event,</text>
<text class="l" x="583" y="303">after checking the session</text>
<text class="l" x="583" y="321">with projmux</text>
<path class="o" d="M545 338H757" marker-end="url(#a)"/>

<!-- 4 PM -> mesh -->
<circle cx="350" cy="372" r="11" fill="#0969da"/><text class="n" x="350" y="377" text-anchor="middle">4</text>
<text class="l" x="368" y="377"><tspan class="m">pane_command</tspan>, citing the event</text>
<path class="o" d="M330 392H757" marker-end="url(#a)"/>

<!-- 5 mesh checks the transcript -->
<rect x="556" y="414" width="190" height="72" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
<use href="#is" x="568" y="424" width="24" height="24" color="#9a6700"/>
<text class="l" x="600" y="441" style="stroke:#fff8c5">check the transcript:</text>
<text class="l" x="568" y="461" style="stroke:#fff8c5">is this your latest</text>
<text class="l" x="568" y="478" style="stroke:#fff8c5">real prompt?</text>
<path class="o" d="M760 424H800V472H763" marker-end="url(#a)"/>
<circle cx="822" cy="448" r="11" fill="#0969da"/><text class="n" x="822" y="453" text-anchor="middle">5</text>

<!-- 6 mesh -> lead keystrokes -->
<circle cx="780" cy="512" r="11" fill="#0969da"/><text class="n" x="780" y="517" text-anchor="middle">6</text>
<text class="l" x="798" y="517">type /compact, wait</text>
<text class="l" x="798" y="535">for it to show,</text>
<text class="l" x="798" y="553">press Enter</text>
<path class="o" d="M760 568H957" marker-end="url(#a)"/>

<!-- 7 mesh -> lead notice -->
<circle cx="780" cy="592" r="11" fill="#0969da"/><text class="n" x="780" y="597" text-anchor="middle">7</text>
<text class="l" x="798" y="597">message:</text>
<text class="l" x="798" y="615">operator-instructed</text>
<text class="l" x="798" y="633">keypress</text>
<path class="o" d="M760 646H957" marker-end="url(#a)"/>

</svg>
