\* Scenario FollowUp: the (mesh) follow-up row (D70) gives a closed item a follow-up draft
\* with `follows`, for a thread reply (section 9) or a revalidate flag (D60); slot 2 is the follow-up.
\* Run with scripts/formal-check.sh (expected results live in its EXPECT table).
SPECIFICATION Spec
CONSTANTS
  N = 2
  NewItems = {1}
  BugfixItems = {}
  ItemVerbs <- AllVerbs
  ChildVerbs = {}
  WithDepends = FALSE
  RetryLimit = 0
  EnvLimit = 0
  MaxReplies = 0
  MaxEvents = 0
  ConfigEdits = 0
  LeadLoss = FALSE
  Panes = {}
  WithRefuse = FALSE
  WithOverride = FALSE
  FollowUpOn = {"thread reply", "revalidate flag"}
  RejectTriggersInScope = {"reply", "revalidate flag", "review"}
  MaxContractVersion = 2
  MaxAttempts = 2
  MaxSeq = 0
  MaxVersion = 0
  MaxCancelled = 2
VIEW View
CONSTRAINT Bounds
CHECK_DEADLOCK FALSE
INVARIANT TypeOK VerifiedBound FlagClearedByReverify
PROPERTY TableOnly GuardRefusedUnchanged CloseGates
