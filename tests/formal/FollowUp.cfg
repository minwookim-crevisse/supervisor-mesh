\* Scenario FollowUp: a closed item gets a follow-up draft with `follows`, from a thread
\* reply (slack watcher, section 9, D41) or a revalidate flag (pm, D60); slot 2 is the follow-up.
\* Run with scripts/formal-check.sh (expected results live in its EXPECT table).
SPECIFICATION Spec
CONSTANTS
  N = 2
  NewItems = {1}
  BugfixItems = {}
  ItemVerbs <- AllVerbs
  ChildVerbs = {}
  WithDepends = FALSE
  RetryLimit = 0
  EnvLimit = 0
  MaxReplies = 0
  MaxEvents = 0
  ConfigEdits = 0
  LeadLoss = FALSE
  Panes = {}
  WithRefuse = FALSE
  WithOverride = FALSE
  FollowUpBy = {"slack watcher", "pm"}
  SplitFailure = "kept"
  O38 = "stay_linked"
  O39 = "unblock_pass"
  ClockTies = FALSE
  MaxContractVersion = 2
  MaxAttempts = 2
  MaxClock = 0
  MaxVersion = 0
  MaxCancelled = 2
VIEW View
CONSTRAINT Bounds
CHECK_DEADLOCK FALSE
INVARIANT TypeOK VerifiedBound
PROPERTY TableOnlyExceptStructural GuardRefusedUnchanged CloseGates
