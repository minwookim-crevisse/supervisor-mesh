\* Scenario Cas: two lead panes of the item's role run verify as read-check, unlocked
\* commands and a compare-and-set write (section 8, D57) while the PM, the Slack watcher,
\* a verification config edit (inputs_changed) and the other pane write the same record.
\* The item is a bugfix item (failing_before).  Only verify has this encoding.
\* Run with scripts/formal-check.sh (expected results live in its EXPECT table).
