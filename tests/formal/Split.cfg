\* Scenario Split: a parent split into two children (D54, D61): the split keeps the parent's
\* conflict/too_large failure record (failures[] append-only, D75); a cancelled child or a cancelled
\* parent cancels the remaining active children (D66); the parent's own verification has its (mesh)
\* rows (D72).  Two children fill every child slot, so no re-split happens here (Resplit has room).
\* Children use only the happy path and cancel (ChildVerbs); the parent has every way
\* out of the states it reaches, so NoDeadItem (inv 2) can be checked here.
\* Run with scripts/formal-check.sh (expected results live in its EXPECT table).
