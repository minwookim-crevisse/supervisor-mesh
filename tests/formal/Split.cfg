\* Scenario Split: a parent split into two children (D54, D61), as written: the split keeps
\* the parent's conflict/too_large failure record (failures[], SplitFailure = "kept") and a
\* cancelled child stays linked (O3-8 stay_linked).  Two children fill every child slot, so
\* no re-split happens here (the O3-8 scenarios have room for one).
\* Children use only the happy path and cancel (ChildVerbs); the parent has every way
\* out of the states it reaches, so NoDeadItem (inv 2) can be checked here.
\* Run with scripts/formal-check.sh (expected results live in its EXPECT table).
