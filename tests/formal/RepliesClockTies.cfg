\* Scenario RepliesClockTies: Replies with the limit-entry time free to tie with the latest
\* reply/event time or lag one tick behind it (Slack ts and the PM machine clock are two
\* clocks, D64); the single-use bit of D63 is load-bearing here (N2).
\* Run with scripts/formal-check.sh (expected results live in its EXPECT table).
