\* Scenario Core: one bugfix item, every single-item path except replies:
\* states, blocked reasons, failure routes, counters, failing_before, config hash,
\* revalidate flag, lead loss.  O3-9 = the table's reading (a passing unblock counts).
\* Run with scripts/formal-check.sh (expected results live in its EXPECT table).
SPECIFICATION Spec
CONSTANTS
  N = 1
  NewItems = {1}
  BugfixItems = {1}
  ItemVerbs <- AllVerbs
  ChildVerbs = {}
  WithDepends = TRUE
  RetryLimit = 1
  EnvLimit = 1
  MaxReplies = 0
  MaxEvents = 0
  ConfigEdits = 1
  LeadLoss = TRUE
  Panes = {}
  WithRefuse = FALSE
  WithOverride = FALSE
  FollowUpBy = {}
  SplitFailure = "kept"
  O38 = "stay_linked"
  O39 = "unblock_pass"
  ClockTies = FALSE
  MaxContractVersion = 3
  MaxAttempts = 4
  MaxClock = 3
  MaxVersion = 0
  MaxCancelled = 1
VIEW View
CONSTRAINT Bounds
CHECK_DEADLOCK FALSE
INVARIANT TypeOK TableExits TableReach NoDeadItem BoundedStarts VerifiedBound DependsWellFormed
PROPERTY TableOnly GuardRefusedUnchanged LimitOnlyByMesh CloseGates StartNeedsDepends
