\* Scenario DepsRoutes: two items, item 2 may depend on item 1; the other ways back to ready keep
\* depends: reassign (rework, after a reject) and unblock (blocked(environment), after a fail).  A
\* dependency cancelled meanwhile is refused there (D81), so no ready item depends on a cancelled one.
\* Run with scripts/formal-check.sh (expected results live in its EXPECT table).
SPECIFICATION Spec
CONSTANTS
  N = 2
  NewItems = {1, 2}
  BugfixItems = {}
  ItemVerbs = {"new", "ready", "start", "submit", "verify", "fail", "reassign", "unblock", "revalidate", "reject", "cancel", "mesh"}
  ChildVerbs = {}
  WithDepends = TRUE
  RetryLimit = 0
  EnvLimit = 1
  MaxReplies = 0
  MaxEvents = 0
  ConfigEdits = 0
  LeadLoss = FALSE
  Panes = {}
  WithRefuse = FALSE
  WithOverride = FALSE
  FollowUpOn = {}
  RejectTriggersInScope = {"reply", "revalidate flag", "review"}
  MaxContractVersion = 1
  MaxAttempts = 2
  MaxSeq = 1
  MaxVersion = 0
  MaxCancelled = 2
VIEW View
CONSTRAINT Bounds
CHECK_DEADLOCK FALSE
INVARIANT TypeOK BoundedStarts VerifiedBound DependsWellFormed NoWaitOnCancelled ReviewRejectEnabled
PROPERTY TableOnly GuardRefusedUnchanged StartNeedsDepends DependentsBlockedOnCancel DependsNotCancelledAtReady StartUnderPinnedConfig ReadyRevisesByClass SubmitDescendsFromBase PinnedOnEnteringReady
