  NewItems = {1}
  BugfixItems = {}
  ItemVerbs <- AllVerbs
  ChildVerbs = {}
  WithDepends = FALSE
  RetryLimit = 0
  EnvLimit = 0
  MaxReplies = 0
  MaxEvents = 0
  ConfigEdits = 0
  LeadLoss = FALSE
  Panes = {}
  WithRefuse = FALSE
  WithOverride = FALSE
  FollowUpOn = {"revalidate flag"}
  MaxContractVersion = 2
  MaxAttempts = 2
  MaxSeq = 0
  MaxVersion = 0
  MaxCancelled = 2
VIEW View
CONSTRAINT Bounds
CHECK_DEADLOCK FALSE
INVARIANT TypeOK VerifiedBound FlagClearedByReverify
PROPERTY TableOnly GuardRefusedUnchanged CloseGates
