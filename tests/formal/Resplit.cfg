\* Scenario Resplit: a split parent with room for a re-split after a cancelled child (D66, D67):
\* the cascade cancels the sibling, the next split unlinks both to former_children[], the re-split
\* can complete.  MaxCancelled = 2 leaves room for one cancel with its cascade.
\* Run with scripts/formal-check.sh (expected results live in its EXPECT table).
SPECIFICATION Spec
CONSTANTS
  N = 5
  NewItems = {1}
  BugfixItems = {}
  ItemVerbs = {"new", "ready", "start", "fail", "split", "mesh", "close"}
  ChildVerbs = {"ready", "start", "submit", "verify", "close", "cancel"}
  WithDepends = FALSE
  RetryLimit = 0
  EnvLimit = 0
  MaxReplies = 0
  MaxEvents = 0
  ConfigEdits = 0
  LeadLoss = FALSE
  Panes = {}
  WithRefuse = FALSE
  WithOverride = FALSE
  FollowUpOn = {}
  RejectTriggersInScope = {"reply", "revalidate flag", "review"}
  MaxContractVersion = 3
  MaxAttempts = 2
  MaxSeq = 2
  MaxVersion = 0
  MaxCancelled = 2
VIEW View
CONSTRAINT Bounds
CHECK_DEADLOCK FALSE
INVARIANT TypeOK BoundedStarts VerifiedBound ParentOwnVerification RouteDefined NoOrphanChildren
PROPERTY TableOnly GuardRefusedUnchanged LimitOnlyByMesh CloseGates ResplitCanComplete ReadyRevisesByClass SubmitDescendsFromBase PinnedOnEnteringReady
