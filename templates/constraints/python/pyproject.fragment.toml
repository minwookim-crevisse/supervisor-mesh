# supervisor-mesh primed constraint (Pillar ② — Python stack). Appended to pyproject.toml by init when absent.
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "TID"]   # why: style(E) · dead code/unused(F) · import order(I) · naming(N) · tidy imports(TID)
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"    # why: absolute imports only — refactor-safe, explicit origin

[tool.mypy]
strict = true                   # why: catch type errors before runtime
warn_unused_ignores = true      # why: stale ignores = silent drift
# CI must run all three, each exit 0: `ruff check .` · `lint-imports` (import-linter) · `mypy <PACKAGE>`.
# Shared-dep version pins: pin and DO NOT bump arbitrarily  # why: env-wide breakage risk.
